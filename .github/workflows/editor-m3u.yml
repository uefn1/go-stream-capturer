name: Editor M3U
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'add or delete'
        required: true
        type: choice
        options: [add, delete]
      channel_short_name:
        description: 'add/delete共通 short_name'
        required: true
        type: string
      channel_formal_name:
        description: 'add時のみ必須'
        required: false
        type: string
      m3u_url:
        description: 'add時のみ必須 http:// または https://...'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edit config
        env:
          ACTION: ${{ inputs.action }}
          CHANNEL_SHORT_NAME: ${{ inputs.channel_short_name }}
          CHANNEL_FORMAL_NAME: ${{ inputs.channel_formal_name }}
          M3U_URL: ${{ inputs.m3u_url }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          if [ "$ACTION" = "add" ]; then
            # http:// または https:// で始まるかをチェック
            if [[ ! "$M3U_URL" =~ ^https?:// ]]; then
              echo "Error: URL must start with http:// or https://"
              exit 1
            fi
            
            # 環境変数と jq の --arg を使って安全にJSONを組み立てる（インジェクション対策）
            jq --arg sn "$CHANNEL_SHORT_NAME" \
               --arg fn "$CHANNEL_FORMAL_NAME" \
               --arg url "$M3U_URL" \
               'map(select(.short_name != $sn)) + [{"short_name": $sn, "formal_name": $fn, "m3u_url": $url}]' \
               config.json > tmp.json
            mv tmp.json config.json
            git add config.json
            git commit -m "add $CHANNEL_SHORT_NAME"
            
          elif [ "$ACTION" = "delete" ]; then
            jq --arg sn "$CHANNEL_SHORT_NAME" \
               'map(select(.short_name != $sn))' \
               config.json > tmp.json
            mv tmp.json config.json
            git add config.json
            git commit -m "delete $CHANNEL_SHORT_NAME"
          fi
          
          git push origin main
