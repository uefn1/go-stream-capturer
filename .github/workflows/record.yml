name: Record
on:
  workflow_dispatch:
    inputs:
      json_path:
        description: 'path to the json file'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: rec-${{ inputs.json_path }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: get config
        id: config
        run: |
          CHANNEL=$(jq -r '.channel' "${{ inputs.json_path }}")
          MINUTES=$(jq -r '.minutes' "${{ inputs.json_path }}")
          M3U_URL=$(jq -r --arg c "$CHANNEL" '.[] | select(.short_name == $c) | .m3u_url' config.json)
          
          if [ -z "$M3U_URL" ] || [ "$M3U_URL" = "null" ]; then echo "URL not found"; exit 1; fi
          
          START_JST=$(jq -r '.start_at' "${{ inputs.json_path }}")
          DATE_STR=$(echo "$START_JST" | awk -F' ' '{gsub("-","",$1); gsub(":","",$2); print $1"-"$2}')
          
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "MINUTES=$MINUTES" >> $GITHUB_ENV
          echo "M3U_URL=$M3U_URL" >> $GITHUB_ENV
          echo "START_JST=$START_JST" >> $GITHUB_ENV
          echo "TAG_NAME=rec-${CHANNEL}-${DATE_STR}" >> $GITHUB_ENV

      - name: record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 録画前にReleaseの器（タグ）を作成しておく
          gh release create ${{ env.TAG_NAME }} --title "${{ env.TAG_NAME }}" --notes "Auto recorded" || true
          
          cd recorder
          go mod tidy
          # -start を追加し、Goプログラム内で指定時間まで待機させる
          go run ./main.go -url "${{ env.M3U_URL }}" -minutes "${{ env.MINUTES }}" -split 600 -out out -tag "${{ env.TAG_NAME }}" -start "${{ env.START_JST }}"
          
      - name: move to finished
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          DEST="finished/$(basename "${{ inputs.json_path }}")"
          git mv "${{ inputs.json_path }}" "$DEST"
          git commit -m "finished ${{ inputs.json_path }}"
          
          for i in {1..10}; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Successfully pushed"
              exit 0
            fi
            sleep $(( RANDOM % 3 + 2 ))
          done
          
          echo "Failed to push after 10 retries"
          exit 1
