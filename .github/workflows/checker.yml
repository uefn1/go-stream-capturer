name: Checker
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全履歴をフェッチしてブランチ追跡を安定化
      - name: daemon loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # 60分間ループ（1分おき）
          END_TIME=$(( $(date +%s) + 3600 ))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            # 【重要】マージ競合を100%回避する自己修復プル
            git fetch origin main
            git reset --hard origin/main
            
            for file in queue/*.json; do
              [ -e "$file" ] || continue
              
              START_AT=$(jq -r '.start_at' "$file")
              # JSTをEpoch秒に変換
              START_EPOCH=$(TZ=Asia/Tokyo date -d "$START_AT" +%s 2>/dev/null || date -d "${START_AT}+09:00" +%s)
              NOW=$(date +%s)
              
              # 開始10分前(600秒) 以降なら実行
              if [ $NOW -ge $((START_EPOCH - 600)) ]; then
                echo "Starting record for $file"
                NEW_FILE="running/$(basename "$file")"
                
                git mv "$file" "$NEW_FILE"
                jq '.status = "running"' "$NEW_FILE" > tmp.json && mv tmp.json "$NEW_FILE"
                git commit -m "running $NEW_FILE"
                
                # プッシュが成功するまでリトライ（競合を完全に回避）
                PUSH_SUCCESS=false
                for i in {1..5}; do
                  if git push origin main; then
                    PUSH_SUCCESS=true
                    break
                  fi
                  echo "Push failed. Retrying in few seconds..."
                  sleep $(( RANDOM % 3 + 2 ))
                  git fetch origin main
                  git rebase origin/main || git rebase --abort
                done
                
                # プッシュが成功した場合のみWorkflowを起動
                if [ "$PUSH_SUCCESS" = true ]; then
                  gh workflow run record.yml -R ${{ github.repository }} -f json_path="$NEW_FILE"
                else
                  echo "Skipping workflow trigger because git push failed."
                fi
              fi
            done
            sleep 60
          done
          
          # 60分経過後、デーモン自身を再起動
          gh workflow run checker.yml -R ${{ github.repository }}
